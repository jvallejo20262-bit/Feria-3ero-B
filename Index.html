<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Feria Mañana Deportiva 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap">
<style>
/* Layout: navy sidebar on desktop / tab bar on phones, soft-grey canvas; POS = product grid + scoreboard cart */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF0F6; --surface-3:#E3E8F1;
  --ink:#0B1220; --ink-2:#47536D; --ink-3:#7A869E; --line:#DCE2EC; --line-2:#C9D1DE;
  --brand:#2563EB; --brand-hover:#1D4FD0; --brand-ink:#FFFFFF; --brand-soft:#E4ECFE; --brand-text:#1D4ED8;
  --lime:#C8FF5F; --lime-ink:#0B1220; --lime-soft:#F1FFD6;
  --navy:#0B1220; --navy-2:#16213A; --navy-3:#1F2C49; --on-navy:#E8EDF7; --on-navy-2:#8F9CB8;
  --good:#127A3A; --good-soft:#E2F5E8; --warn:#9A5800; --warn-soft:#FCF0DA; --bad:#C92A2A; --bad-soft:#FCE6E6;
  --m-efe:#12A150; --m-tra:#2563EB; --m-tar:#0B1220;
  --shadow:0 1px 2px rgba(11,18,32,.05),0 6px 20px rgba(11,18,32,.06);
  --shadow-lg:0 24px 60px rgba(11,18,32,.22);
  --backdrop:rgba(11,18,32,.48);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --r:16px; --r-sm:11px; --r-xs:8px;
  --side-w:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A101C; --surface:#111A2C; --surface-2:#172238; --surface-3:#1E2B45;
  --ink:#EAF0FA; --ink-2:#A3B0C8; --ink-3:#71809C; --line:#223050; --line-2:#2E3D60;
  --brand:#4A82F7; --brand-hover:#6797FA; --brand-ink:#FFFFFF; --brand-soft:#16264A; --brand-text:#8DB2FF;
  --lime-soft:#24321A;
  --navy:#060A13; --navy-2:#111A2C; --navy-3:#1A2640; --on-navy:#E8EDF7; --on-navy-2:#8F9CB8;
  --good:#4ADE80; --good-soft:#123222; --warn:#FBBF24; --warn-soft:#3A2A0C; --bad:#F87171; --bad-soft:#3D1717;
  --m-efe:#4ADE80; --m-tra:#5B8DF8; --m-tar:#C8FF5F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --backdrop:rgba(2,5,12,.66);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A101C; --surface:#111A2C; --surface-2:#172238; --surface-3:#1E2B45;
  --ink:#EAF0FA; --ink-2:#A3B0C8; --ink-3:#71809C; --line:#223050; --line-2:#2E3D60;
  --brand:#4A82F7; --brand-hover:#6797FA; --brand-ink:#FFFFFF; --brand-soft:#16264A; --brand-text:#8DB2FF;
  --lime-soft:#24321A;
  --navy:#060A13; --navy-2:#111A2C; --navy-3:#1A2640; --on-navy:#E8EDF7; --on-navy-2:#8F9CB8;
  --good:#4ADE80; --good-soft:#123222; --warn:#FBBF24; --warn-soft:#3A2A0C; --bad:#F87171; --bad-soft:#3D1717;
  --m-efe:#4ADE80; --m-tra:#5B8DF8; --m-tar:#C8FF5F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --backdrop:rgba(2,5,12,.66);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:26px;height:26px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));gap:18px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand-mark{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand-mark span{color:var(--lime)}
.brand-sub{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-navy-2);font-weight:600}
.brand-sub b{background:var(--lime);color:var(--lime-ink);border-radius:4px;padding:1px 6px;letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-navy-2);padding:14px 12px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--on-navy-2);padding:11px 12px;border-radius:11px;font-weight:600;font-size:14.5px;text-align:left;position:relative;transition:background .15s,color .15s}
.nav button:hover{background:var(--navy-2);color:var(--on-navy)}
.nav button[aria-current="page"]{background:var(--navy-3);color:var(--on-navy)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--lime)}
.nav button[aria-current="page"] svg{color:var(--lime)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:var(--navy-2);border-radius:12px;padding:10px}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--lime);color:var(--lime-ink);flex:none;font-size:14px}
.who-name{font-weight:700;font-size:13.5px;line-height:1.2}
.who-role{font-size:11.5px;color:var(--on-navy-2)}
.side-btn{display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--navy-3);background:transparent;color:var(--on-navy-2);border-radius:10px;padding:9px;font-weight:600;font-size:13px}
.side-btn:hover{color:var(--on-navy);border-color:var(--on-navy-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:64px}
.top-title{display:flex;flex-direction:column;min-width:0;flex:1}
.top-title h1{font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{font-size:12px;color:var(--ink-3);font-weight:500}
.top-brand{display:none;font-family:var(--display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;line-height:1}
.top-brand span{color:var(--brand)}
.top-actions{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand-text)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
#view{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;flex:1}
.banner{margin:14px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--brand-soft);color:var(--brand-text)}
.banner .btn{margin-left:auto}

.tabbar{display:none}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:650;font-size:14.5px;padding:10px 16px;min-height:44px;transition:transform .08s,background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.lime:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-soft{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.xl{min-height:58px;font-size:17px;border-radius:14px;padding:12px 20px}
.btn.block{width:100%}
.btn-export{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.label{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.field small{font-size:12px;color:var(--ink-3)}
.input,select.input,textarea.input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:10px 13px;font-size:15.5px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.input.err{border-color:var(--bad)}
.input-wrap{position:relative}
.input-wrap .pre{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:600;pointer-events:none}
.input-wrap .input{padding-left:28px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:40px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.err-msg{color:var(--bad);font-size:13px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:13px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:650;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--brand-soft);color:var(--brand-text)}
.tag.lime{background:var(--lime);color:var(--lime-ink)}

/* ---------- Cards / sections ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:15.5px;font-weight:750}
.card-h .sub{font-size:12.5px;color:var(--ink-3)}
.section-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-h h2{font-size:17px;font-weight:800}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{min-width:min(100%,240px)}
.toolbar select.input{width:auto;min-width:150px;flex:0 1 auto}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 20px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
.empty .em-ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink)}
.empty h3{font-size:17px;font-weight:800}
.empty p{margin:0;color:var(--ink-2);max-width:42ch;font-size:14px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-l{font-size:12px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.06em}
.kpi .k-v{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.005em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12.5px;color:var(--ink-3)}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.kpi.hero .k-l{color:var(--on-navy-2)}
.kpi.hero .k-s{color:var(--on-navy-2)}
.kpi.hero .k-v{color:var(--lime)}
.kpi.neg .k-v{color:var(--bad)}
.kpis.small .kpi .k-v{font-size:26px}
.kpis.small{grid-template-columns:repeat(6,minmax(0,1fr))}
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-top:12px}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink-3)}
.legend{display:flex;flex-direction:column;gap:10px}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13.5px}
.legend-row .sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend-row b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-wrap{display:grid;grid-template-columns:minmax(96px,132px) minmax(0,1fr);gap:16px;align-items:center}
.legend{min-width:0}
.legend-row span:not(.sw){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.hbar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .vl{font-variant-numeric:tabular-nums;font-weight:700}
.hbar .track{grid-column:1/-1;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--brand)}
.hbar .fill.alt{background:var(--lime)}
.be-track{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;margin:10px 0 8px;position:relative}
.be-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--lime));border-radius:7px}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-bottom:16px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.pos-main{min-width:0;display:flex;flex-direction:column;gap:14px}
.pos-tools{display:flex;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:border-color .15s,transform .1s,box-shadow .15s;min-width:0}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pcard:active{transform:scale(.985)}
.pcard.in{border-color:var(--brand)}
.pcard.out{opacity:.55}
.pc-hit{border:0;background:transparent;padding:0;margin:0;text-align:left;display:flex;flex-direction:column;flex:1;width:100%;color:inherit;font:inherit;cursor:pointer;border-radius:inherit}
.pc-hit[disabled]{cursor:not-allowed}
.pcard .ph{aspect-ratio:16/10;max-width:100%;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;position:relative}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph .ini{font-family:var(--display);font-weight:800;font-style:italic;font-size:38px;color:var(--ink-3);text-transform:uppercase}
.pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .pn{font-weight:700;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pp{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.pcard .price{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.pcard .badge{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 4px 10px rgba(37,99,235,.35)}
.pcard .add{position:absolute;bottom:10px;right:10px}
.cart{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;max-height:calc(100dvh - 108px);overflow:hidden}
.cart-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cart-h h2{font-size:16px;font-weight:800}
.cart-lines{overflow-y:auto;padding:6px 10px;flex:1;min-height:120px}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 8px;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.cline .nm{font-weight:650;font-size:14px;line-height:1.3}
.cline .sub{font-size:12.5px;color:var(--ink-3)}
.cline .stepper{justify-self:start}

const S = {productos:{},ventas:{},movimientos:{},gastos:{},cajas:{},auditoria:{},config:null};
let MODE = "cargando";   // "nube" | "local" | "lectura"
let DB = null, USERCAP = null, READY = false, VER = 0;
const UNSUBS = [];

function bump(){ VER++; scheduleRender(); }
function saveLocal(){
  const ok = lsSet(LS.data, {v:1, guardado:Date.now(), ...S});
  if(!ok) toast("No se pudo guardar en este dispositivo: el almacenamiento del navegador está lleno o bloqueado.", {type:"err"});
  return ok;
}
function loadLocal(){
  const d = lsGet(LS.data);
  for(const c of COLS) S[c] = (d && d[c] && typeof d[c]==="object") ? d[c] : {};
  S.config = d && d.config ? d.config : null;
}
function canWrite(){ return MODE==="nube" || MODE==="local"; }
function writeGuard(){
  if(canWrite()) return true;
  toast("Esta cuenta solo puede consultar. Para registrar, usa el modo «Solo este dispositivo» en Ajustes.", {type:"err"});
  return false;
}
function clean(o){ return JSON.parse(JSON.stringify(o)); }
function dbErr(e){
  const c = e && e.code;
  if(c==="quota_exceeded") return "La base de datos llegó a su límite de espacio. Descarga un respaldo y libera registros antiguos.";
  if(c==="invalid_argument") return "Tu cuenta no tiene permiso para guardar en la base compartida.";
  if(c==="revoked") return "Se perdió el acceso a la base compartida. Recarga la página.";
  if(c==="resource_exhausted") return "Demasiadas operaciones seguidas. Espera unos segundos e inténtalo de nuevo.";
  return "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
}
async function put(col, doc){
  if(!writeGuard()) throw new Error("solo-lectura");
  const prev = S[col][doc.id];
  S[col] = {...S[col], [doc.id]: doc}; bump();
  if(MODE==="local"){ if(!saveLocal()){ S[col]={...S[col]}; if(prev) S[col][doc.id]=prev; else delete S[col][doc.id]; bump(); throw new Error("local"); } return; }
  try{ await DB.collection(col).doc(doc.id).set(clean(doc)); }
  catch(e){
    if(e && e.code==="unavailable"){ await sleep(400+Math.random()*600); try{ await DB.collection(col).doc(doc.id).set(clean(doc)); return; }catch(e2){ e=e2; } }
    S[col]={...S[col]}; if(prev) S[col][doc.id]=prev; else delete S[col][doc.id]; bump();
    if(e && e.code==="invalid_argument"){ MODE="lectura"; bump(); }
    toast(dbErr(e),{type:"err"}); throw e;
  }
}
async function removeDoc(col,id){
  const c = {...S[col]}; delete c[id]; S[col]=c; bump();
  if(MODE==="local"){ saveLocal(); return; }
  await DB.collection(col).doc(id).delete();
}
async function putConfig(cfg){
  if(!writeGuard()) throw new Error("solo-lectura");
  const prev=S.config; S.config=cfg; bump();
  if(MODE==="local"){ saveLocal(); return; }
  try{ await DB.doc("config/app").set(clean(cfg)); }
  catch(e){ S.config=prev; bump(); toast(dbErr(e),{type:"err"}); throw e; }
}

function withTimeout(p, ms){ return Promise.race([p, new Promise(r=>setTimeout(()=>r(null),ms))]); }
async function boot(){
  applyTheme();
  const forcedLocal = lsGet(LS.modo)==="local";
  let tries=0; while(!window.claude && tries<10){ await sleep(150); tries++; }
  let db=null, user=null;
  if(window.claude && typeof window.claude.use==="function" && !forcedLocal){
    try{ [db,user] = await Promise.all([withTimeout(window.claude.use("db"),9000), withTimeout(window.claude.use("user"),9000)]); }catch(e){ db=null; }
  }
  USERCAP = user || null;
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(d=>{ DOWNLOADS=d; }).catch(()=>{});
  }
  if(db){
    DB = db;
    let w=null; try{ w = user ? await user.can("data.write") : null; }catch(e){}
    MODE = w===false ? "lectura" : "nube";
    subscribeCloud();
  } else { bootLocal(); }
}
function bootLocal(){
  UNSUBS.splice(0).forEach(u=>{try{u()}catch(e){}});
  DB=null; MODE="local"; loadLocal(); READY=true; bump();
}
function subscribeCloud(){
  const pending = new Set([...COLS,"config"]);
  const done = k => { if(pending.delete(k) && pending.size===0){ READY=true; } bump(); };
  const onErr = e => { if(e && e.code==="revoked"){ toast("Se perdió el acceso a la base compartida.",{type:"err"}); } };
  for(const c of COLS){
    UNSUBS.push(DB.collection(c).onSnapshot(snap=>{
      const o={}; for(const d of snap.docs){ o[d.id] = {...d.data(), id:d.id}; }
      S[c]=o; done(c);
    }, onErr));
  }
  UNSUBS.push(DB.doc("config/app").onSnapshot(d=>{ S.config = d.exists ? {...d.data()} : null; done("config"); }, onErr));
  setTimeout(()=>{ if(!READY){ READY=true; bump(); } }, 12000);
}

async function hashPin(pin, salt){
  const txt = salt+":"+pin;
  try{ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=2166136261; for(let i=0;i<txt.length;i++){ h^=txt.charCodeAt(i); h=Math.imul(h,16777619); } return "f"+(h>>>0).toString(16); }
}
async function checkPin(pin){ const c=S.config; if(!c) return false; return (await hashPin(pin,c.salt))===c.pinHash; }
function applyTheme(){
  const t = lsGet(LS.tema) || "sistema";
  if(t==="claro") document.documentElement.setAttribute("data-theme","light");
  else if(t==="oscuro") document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
}
function isDark(){
  const a=document.documentElement.getAttribute("data-theme");
  if(a) return a==="dark";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}

   CÁLCULOS (siempre desde los registros guardados)
   ========================================================= */
let DCACHE = {ver:-1};
function D(){
  if(DCACHE.ver===VER) return DCACHE;
  const prods = Object.values(S.productos).sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo)));
  const inv = {};
  for(const p of prods) inv[p.id] = {ini:p.stockInicial||0, ent:0, aj:0, vend:0};
  for(const m of Object.values(S.movimientos)){
    const r = inv[m.productoId]; if(!r) continue;
    if(m.tipo==="entrada") r.ent += m.cantidad||0; else if(m.tipo==="ajuste") r.aj += m.cantidad||0;
  }
  const ventas = Object.values(S.ventas).sort((a,b)=>a.ts-b.ts);
  const E = [];  // efectos de línea (ventas y devoluciones) — solo ventas no anuladas
  for(const s of ventas){
    if(s.estado==="anulada") continue;
    s.items.forEach((it,i)=>{
      const r=inv[it.productoId]; if(r) r.vend += it.cantidad;
      const share = s.total>0 ? it.neto/s.total : 0;
      const pay = {}; for(const m of METODOS) pay[m] = (s.pagos?.[m]||0)*share;
      E.push({ts:s.ts, tipo:"venta", s, idx:i, prod:it.productoId, nombre:it.nombre, cat:it.categoria||"", vend:s.vendedor, qty:it.cantidad, neto:it.neto, costo:it.costo*it.cantidad, pay});
    });
    for(const d of (s.devoluciones||[])){
      for(const l of d.lineas){
        const it = s.items[l.idx]; const r=inv[it.productoId]; if(r) r.vend -= l.cantidad;
        const pay = {efectivo:0,transferencia:0,tarjeta:0}; pay[d.metodo] = -l.monto;
        E.push({ts:d.ts, tipo:"devolucion", s, d, idx:l.idx, prod:it.productoId, nombre:it.nombre, cat:it.categoria||"", vend:s.vendedor, qty:-l.cantidad, neto:-l.monto, costo:-it.costo*l.cantidad, pay});
      }
    }
  }
  const stock = {}; for(const id in inv){ const r=inv[id]; r.act = r.ini + r.ent + r.aj - r.vend; stock[id]=r.act; }
  DCACHE = {ver:VER, prods, inv, stock, ventas, E};
  return DCACHE;
}
function estadoVenta(s){
  if(s.estado==="anulada") return "Anulada";
  const ret = sum(s.devoluciones||[], d=>sum(d.lineas,l=>l.cantidad));
  if(!ret) return "Completada";
  return ret >= sum(s.items,i=>i.cantidad) ? "Devuelta" : "Devolución parcial";
}
const estadoTag = e => ({"Completada":"ok","Anulada":"bad","Devuelta":"warn","Devolución parcial":"warn"}[e]||"");
function returnedQty(s, idx){ return sum(s.devoluciones||[], d=>sum(d.lineas.filter(l=>l.idx===idx), l=>l.cantidad)); }
function returnedAmt(s, idx){ return sum(s.devoluciones||[], d=>sum(d.lineas.filter(l=>l.idx===idx), l=>l.monto)); }
function saleNet(s){ return s.estado==="anulada" ? 0 : s.total - sum(s.devoluciones||[], d=>d.monto); }
function gastosActivos(){ return Object.values(S.gastos).filter(g=>g.estado!=="anulado").sort((a,b)=>a.ts-b.ts); }

/** Indicadores con filtros (fecha, producto, categoría, vendedor). */
function calc(F={}){
  const {E, prods, stock} = D();
  const inDate = ts => (!F.desde || dayKey(ts)>=F.desde) && (!F.hasta || dayKey(ts)<=F.hasta);
  const e = E.filter(x => inDate(x.ts) && (!F.producto || x.prod===F.producto) && (!F.categoria || x.cat===F.categoria) && (!F.vendedor || x.vend===F.vendedor));
  const ventas = sum(e,x=>x.neto), cmv = sum(e,x=>x.costo), unidades = sum(e,x=>x.qty);
  const trans = new Set(e.filter(x=>x.tipo==="venta").map(x=>x.s.id)).size;
  const gastosList = gastosActivos().filter(g=>inDate(g.ts));
  const gastos = sum(gastosList,g=>g.monto);
  const pay = {efectivo:0,transferencia:0,tarjeta:0};
  for(const x of e) for(const m of METODOS) pay[m]+=x.pay[m];
  for(const m of METODOS) pay[m]=Math.round(pay[m]);
  const bruta = ventas - cmv, neta = bruta - gastos;
  const byProd = {};
  for(const x of e){ const r = byProd[x.prod] ||= {id:x.prod, nombre:x.nombre, qty:0, neto:0, costo:0}; r.qty+=x.qty; r.neto+=x.neto; r.costo+=x.costo; }
  const prodRows = Object.values(byProd).map(r=>({...r, gan:r.neto-r.costo}));
  const byHour = {}; for(const x of e){ const h=hourOf(x.ts); byHour[h]=(byHour[h]||0)+x.neto; }
  const mc = ventas>0 ? bruta/ventas : 0;
  const pe = (gastos>0 && mc>0) ? Math.round(gastos/mc) : null;
  const ganUnit = unidades>0 ? bruta/unidades : 0;
  const peUnits = (gastos>0 && ganUnit>0) ? Math.ceil(gastos/ganUnit) : null;
  const invUnits = sum(prods.filter(p=>p.activo!==false), p=>Math.max(0,stock[p.id]||0));
  const invValue = sum(prods, p=>Math.max(0,stock[p.id]||0)*(p.costo||0));
  const lowStock = prods.filter(p=>p.activo!==false && (stock[p.id]||0) <= (p.stockMin||0));
  // evolución: utilidad neta acumulada en el tiempo
  const ev = [...e.map(x=>({ts:x.ts, d:x.neto-x.costo})), ...gastosList.map(g=>({ts:g.ts, d:-g.monto}))].sort((a,b)=>a.ts-b.ts);
  let acc=0; const evo = ev.map(p=>({ts:p.ts, v:(acc+=p.d)}));
  return {e, ventas, cmv, unidades, trans, gastos, gastosList, pay, bruta, neta, prodRows, byHour, mc, pe, peUnits, invUnits, invValue, lowStock, evo,
    margenNeto: ventas>0? neta/ventas : 0, roi: (cmv+gastos)>0 ? neta/(cmv+gastos) : 0, ticket: trans>0 ? ventas/trans : 0};
}
function cajaAbierta(){ return Object.values(S.cajas).find(c=>!c.cerrada) || null; }
function cajaCalc(c){
  const {E} = D(); const end = c.cerrada || Date.now();
  const e = E.filter(x=>x.ts>=c.abierta && x.ts<=end);
  const pay={efectivo:0,transferencia:0,tarjeta:0}; for(const x of e) for(const m of METODOS) pay[m]+=x.pay[m];
  for(const m of METODOS) pay[m]=Math.round(pay[m]);
  const devEfe = Math.round(sum(e.filter(x=>x.tipo==="devolucion"), x=>-x.pay.efectivo));
  const entradas = sum((c.movimientos||[]).filter(m=>m.tipo==="entrada"), m=>m.monto);
  const salidas = sum((c.movimientos||[]).filter(m=>m.tipo==="salida"), m=>m.monto);
  const esperado = (c.fondo||0) + pay.efectivo + entradas - salidas;
  const ventasN = new Set(e.filter(x=>x.tipo==="venta").map(x=>x.s.id)).size;
  return {efectivo:pay.efectivo, transferencia:pay.transferencia, tarjeta:pay.tarjeta, devEfe, entradas, salidas, esperado, total:pay.efectivo+pay.transferencia+pay.tarjeta, ventasN};
}

function toast(msg, o={}){
  const box=$("#toasts"); const el=document.createElement("div");
  el.className="toast"+(o.type==="err"?" err":"");
  el.innerHTML=`<span class="t-ico">${ic(o.type==="err"?"alert":"check","sm")}</span><span class="t-msg"></span>${o.action?`<button type="button">${esc(o.action.label)}</button>`:""}`;
  el.querySelector(".t-msg").textContent=msg;
  if(o.action) el.querySelector("button").onclick=()=>{ el.remove(); o.action.fn(); };
  box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(), o.ms || (o.action?6000:o.type==="err"?6000:3200));
}

      onClose:()=>{ if(!done) res(null); }});

const VIEW_FN = {};
function cartQty(pid){ const l=UI.cart.find(x=>x.pid===pid); return l?l.qty:0; }
function cartTotals(){
  let sub=0, units=0;
  for(const l of UI.cart){ const p=S.productos[l.pid]; if(!p) continue; sub+=p.precio*l.qty; units+=l.qty; }
  return {sub, units};
}
function addToCart(pid, n=1){
  const p=S.productos[pid]; if(!p) return;
  const st=D().stock[pid]||0; const cur=cartQty(pid);
  if(cur+n>st){ toast(st<=0?`${p.nombre} está agotado.`:`Solo quedan ${st} unidades de ${p.nombre}.`,{type:"err"}); return; }
  const l=UI.cart.find(x=>x.pid===pid);
  if(l) l.qty+=n; else UI.cart.push({pid, qty:n});
  if(l && l.qty<=0) UI.cart=UI.cart.filter(x=>x!==l);
  scheduleRender();
}
function setCartQty(pid,q){
  const l=UI.cart.find(x=>x.pid===pid); if(!l) return;
  if(q<=0){ removeLine(pid); return; }
  const st=D().stock[pid]||0;
  if(q>st){ toast(`Solo quedan ${st} unidades.`,{type:"err"}); q=st; }
  l.qty=q; scheduleRender();
}
function removeLine(pid){
  const i=UI.cart.findIndex(x=>x.pid===pid); if(i<0) return;
  const [l]=UI.cart.splice(i,1); scheduleRender();
  const p=S.productos[pid];
  toast(`Quitaste ${p?p.nombre:"el producto"} del carrito.`,{action:{label:"Deshacer",fn:()=>{ UI.cart.splice(Math.min(i,UI.cart.length),0,l); scheduleRender(); }}});
}

/* ---------- cobro ---------- */
function allocDiscount(lines, desc){
  const subT=sum(lines,l=>l.subtotal);
  if(!desc || !subT) return lines.map(()=>0);
  const raw=lines.map(l=>desc*l.subtotal/subT);
  const out=raw.map(Math.floor); let rem=desc-sum(out);
  raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(rem>0){ out[i]++; rem--; } });
  return out;
}

  el.addEventListener("input", refresh);

    const p=e.target.closest("[data-pay]"); if(p){ CO.metodo=p.dataset.pay; refresh(); return; }

async function confirmSale(CO, el, get){
  if(CO.busy) return;
  const err=m=>{ el.querySelector("#co-err").textContent=m; };
  const g=get();
  if(g.err) return err(g.err);
  if(!g.lines.length) return err("El carrito está vacío.");
  const st=D().stock;
  for(const l of g.lines){ if(l.p.activo===false) return err(`${l.p.nombre} fue desactivado.`); if(l.qty>(st[l.p.id]||0)) return err(`Solo quedan ${st[l.p.id]||0} unidades de ${l.p.nombre}. Ajusta la cantidad.`); }
  let pagos={efectivo:0,transferencia:0,tarjeta:0}, recibido=null, vuelto=null;
  if(CO.metodo==="mixto"){
    for(const m of METODOS){ const v=el.querySelector(`[data-mix="${m}"]`).value.trim(); if(v){ const c=parseMoney(v); if(c==null) return err(`Revisa el monto de ${MLABEL[m].toLowerCase()}.`); pagos[m]=c; } }
    if(sum(METODOS,m=>pagos[m])!==g.total) return err("En el pago mixto, la suma de los montos debe ser igual al total.");
    if(METODOS.filter(m=>pagos[m]>0).length<2) return err("Un pago mixto necesita al menos dos formas de pago. Si es una sola, elige esa opción.");
  } else {
    pagos[CO.metodo]=g.total;
    if(CO.metodo==="efectivo"){ const r=el.querySelector("#co-recibido").value.trim(); if(r){ recibido=parseMoney(r); if(recibido==null) return err("Revisa el dinero recibido."); if(recibido<g.total) return err("El dinero recibido es menor que el total."); vuelto=recibido-g.total; } }
  }
  CO.busy=true; const btn=el.querySelector("#co-ok"); btn.disabled=true; btn.innerHTML="Guardando…";
  const descs=allocDiscount(g.lines, g.desc);
  const items=g.lines.map((l,i)=>({productoId:l.p.id, codigo:l.p.codigo, nombre:l.p.nombre, categoria:l.p.categoria||"", cantidad:l.qty, precio:l.p.precio, costo:l.p.costo, subtotal:l.subtotal, desc:descs[i], neto:l.subtotal-descs[i]}));
  const vsel=el.querySelector("#co-vend");
  const sale={id:CO.id, codigo:CO.id, ts:Date.now(), vendedor: SESSION.role==="vendedor"?SESSION.nombre:(vsel?vsel.value:SESSION.nombre), registradoPor:SESSION.nombre,
    items, subtotal:g.subT, descuento:g.desc, total:g.total, metodo:CO.metodo, pagos, recibido, vuelto, obs:el.querySelector("#co-obs").value.trim(),
    estado:"completada", devoluciones:[], anulacion:null, cajaId:(cajaAbierta()||{}).id||null};
  try{ await put("ventas", sale); }
  catch(e){ CO.busy=false; btn.disabled=false; btn.innerHTML=`${ic("check")}Confirmar venta`; return err("No se guardó la venta. Inténtalo de nuevo; no se cobrará dos veces."); }
  UI.cart=[]; closeModal(true); scheduleRender(); showSuccess(sale);
}
function showSuccess(s){
  const w=document.createElement("div"); w.className="success"; w.setAttribute("role","status");
  w.innerHTML=`<div class="success-card"><div class="success-check">${ic("check")}</div><h2>Venta registrada</h2><div class="amt">${money(s.total)}</div>
    <div class="code">${esc(s.codigo)} · ${esc(MLABEL[s.metodo])}${s.vuelto!=null?` · Vuelto ${money(s.vuelto)}`:""}</div>
    <button class="btn lime xl block" type="button" style="margin-top:10px">Nueva venta</button></div>`;
  document.body.appendChild(w);
  const close=()=>{ w.remove(); const q=$("#pos-q"); if(q && window.matchMedia("(min-width:901px)").matches) q.focus(); };
  w.querySelector("button").onclick=close; w.addEventListener("click",e=>{ if(e.target===w) close(); });
  setTimeout(()=>{ if(document.body.contains(w)) close(); }, s.vuelto!=null?6000:2600);
}

async function resizeImage(file){
  const url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const max=320, k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.78);
}

function invMovements(){

  for(const s of Object.values(S.ventas)){
    s.items.forEach(it=>out.push({ts:s.ts, tipo:"Venta", k:"", prod:it.nombre, q:-it.cantidad, ref:s.codigo, user:s.vendedor}));
    for(const d of (s.devoluciones||[])) d.lineas.forEach(l=>out.push({ts:d.ts, tipo:"Devolución", k:"warn", prod:s.items[l.idx].nombre, q:l.cantidad, ref:`${s.codigo} · ${d.motivo}`, user:d.usuario}));

  }
  return out.sort((a,b)=>b.ts-a.ts);
}

    toast("Gasto anulado.",{action:{label:"Deshacer",fn:async()=>{ const c=S.gastos[id]; await put("gastos",{...c, estado:"activo", anulacion:null}); audit("Gasto restaurado", c.descripcion, "Se deshizo la anulación", c.monto); }}}); }catch(e){}

function emptyMini(){ return `<p class="faint" style="margin:0;font-size:13.5px">Sin ventas en este filtro.</p>`; }
function breakEvenCard(c){
  if(c.gastos<=0) return `<div class="card-h"><h3>Punto de equilibrio</h3></div><p class="faint" style="margin:0;font-size:13.5px">Se calcula cuando haya gastos registrados y ventas con ganancia.</p>`;
  if(!c.pe) return `<div class="card-h"><h3>Punto de equilibrio</h3></div><p class="faint" style="margin:0;font-size:13.5px">Registra ventas con ganancia para calcular cuánto hay que vender para cubrir ${money(c.gastos)} de gastos.</p>`;
  const prog=Math.min(1,c.ventas/c.pe);
  return `<div class="card-h"><h3>Punto de equilibrio</h3><span class="tag ${prog>=1?"ok":"warn"}" style="margin-left:auto">${prog>=1?"Alcanzado":pct(prog)+" logrado"}</span></div>
    <div style="font-size:14px" class="muted">Para cubrir ${money(c.gastos)} de gastos hay que vender <b style="color:var(--ink)">${money(c.pe)}</b>${c.peUnits?` (unas ${intf(c.peUnits)} unidades)`:""}.</div>
    <div class="be-track"><div class="be-fill" style="width:${(prog*100).toFixed(1)}%"></div></div>
    <dl class="kv"><dt>Vendido</dt><dd class="num">${money(c.ventas)}</dd><dt>${prog>=1?"Excedente sobre el equilibrio":"Falta vender"}</dt><dd class="num">${money(Math.abs(c.pe-c.ventas))}</dd><dt>Rentabilidad sobre lo invertido</dt><dd class="num">${pct(c.roi)}</dd><dt>Margen de contribución</dt><dd class="num">${pct(c.mc)}</dd></dl>`;
}
function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function hourChart(byHour){
  const hs=Object.keys(byHour).map(Number);
  if(!hs.length) return `<p class="faint" style="margin:0;font-size:13.5px">Las barras aparecerán con las primeras ventas.</p>`;
  let a=Math.min(...hs,8), b=Math.max(...hs,14); const n=b-a+1;
  const W=640,H=230,L=52,R=10,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const mx=niceMax(Math.max(...Object.values(byHour),1)); const bw=iw/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por hora">`;
  for(let i=0;i<=4;i++){ const v=mx*i/4, y=T+ih-ih*i/4; s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end">${moneyShort(v)}</text>`; }
  for(let h=a;h<=b;h++){ const v=byHour[h]||0, x=L+(h-a)*bw, bh=Math.max(0,v)/mx*ih;
    s+=`<rect x="${x+bw*.18}" y="${T+ih-bh}" width="${bw*.64}" height="${bh}" rx="4" fill="${v===Math.max(...Object.values(byHour))?"var(--brand)":"color-mix(in srgb,var(--brand) 45%,transparent)"}"><title>${h}:00 · ${money(v)}</title></rect>`;
    if(n<=14 || (h-a)%2===0) s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${h}h</text>`; }
  return s+`</svg>`;
}
function donut(pay){
  const tot=sum(METODOS,m=>Math.max(0,pay[m]));
  const colors={efectivo:"var(--m-efe)",transferencia:"var(--m-tra)",tarjeta:"var(--m-tar)"};
  let off=0; const R=60, C=2*Math.PI*R;
  let segs=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="22"/>`;
  if(tot>0) for(const m of METODOS){ const v=Math.max(0,pay[m]); if(!v) continue; const len=v/tot*C;
    segs+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${colors[m]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${MLABEL[m]} ${money(v)}</title></circle>`; off+=len; }
  return `<div class="donut-wrap"><svg viewBox="0 0 160 160" role="img" aria-label="Distribución por forma de pago" style="width:100%;max-width:160px">${segs}<text x="80" y="76" text-anchor="middle" style="font-size:11px;fill:var(--ink-3)">Total</text><text x="80" y="96" text-anchor="middle" style="font-size:17px;font-weight:800;fill:var(--ink)">${moneyShort(tot)}</text></svg>
    <div class="legend">${METODOS.map(m=>`<div class="legend-row"><span class="sw" style="background:${colors[m]}"></span><span>${MLABEL[m]}</span><b>${tot?pct(Math.max(0,pay[m])/tot):"0%"}</b></div><div class="faint num" style="font-size:12.5px;margin:-6px 0 0 22px">${money(pay[m])}</div>`).join("")}</div></div>`;
}
function lineChart(evo){
  if(evo.length<2) return `<p class="faint" style="margin:0;font-size:13.5px">La curva aparece cuando haya al menos dos movimientos (ventas o gastos).</p>`;
  const W=640,H=230,L=56,R=12,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const pts=[{ts:evo[0].ts, v:0}, ...evo];
  const t0=pts[0].ts, t1=Math.max(pts[pts.length-1].ts, t0+60000);
  let lo=Math.min(0,...pts.map(p=>p.v)), hi=Math.max(0,...pts.map(p=>p.v));
  if(hi===lo) hi=lo+100;
  const step=niceMax((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi===lo) hi=lo+step;
  const X=t=>L+(t-t0)/(t1-t0)*iw, Y=v=>T+ih-(v-lo)/(hi-lo||1)*ih;
  let d=""; pts.forEach((p,i)=>{ d+= i? ` H${X(p.ts).toFixed(1)} V${Y(p.v).toFixed(1)}` : `M${X(p.ts).toFixed(1)} ${Y(p.v).toFixed(1)}`; });
  const last=pts[pts.length-1];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Utilidad neta acumulada">`;
  for(let v=lo; v<=hi+step/2; v+=step){ const y=Y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end">${moneyShort(v)}</text>`; }
  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>`;
  s+=`<path d="${d} V${Y(0)} H${X(t0)} Z" fill="color-mix(in srgb,var(--brand) 14%,transparent)"/>`;
  s+=`<path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s+=`<circle cx="${X(last.ts)}" cy="${Y(last.v)}" r="5" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>`;
  const sameDay=dayKey(t0)===dayKey(t1);
  s+=`<text x="${L}" y="${H-8}">${sameDay?fT(t0):fD(t0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${sameDay?fT(t1):fD(t1)}</text>`;
  return s+`</svg>`;
}

function changePin(){

    <div class="grid2 keep"><label class="field"><span>PIN nuevo</span><input class="input" id="cp-n" type="password" inputmode="numeric" maxlength="6"></label><label class="field"><span>Repite el PIN nuevo</span><input class="input" id="cp-n2" type="password" inputmode="numeric" maxlength="6"></label></div><div class="err-msg" id="cp-err"></div>`,
    foot:`<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="cp-ok">Guardar PIN</button>`});
  el.querySelector("#cp-ok").onclick=async()=>{ const E=el.querySelector("#cp-err"); const a=el.querySelector("#cp-a").value, n=el.querySelector("#cp-n").value, n2=el.querySelector("#cp-n2").value;
    if(!(await checkPin(a))) return E.textContent="El PIN actual no es correcto.";
    if(!/^\d{4,6}$/.test(n)) return E.textContent="El PIN nuevo debe tener entre 4 y 6 números.";

    const salt=rnd(12); try{ await putConfig({...S.config, salt, pinHash:await hashPin(n,salt)}); audit("PIN cambiado","Seguridad","",""); closeModal(true); toast("PIN actualizado."); }catch(x){} };
}
function backupObject(){ const o={app:"feria-manana-deportiva-2026", version:1, exportado:new Date().toISOString(), config:S.config}; for(const c of COLS) o[c]=S[c]; return o; }
async function downloadBackup(){
  const name=`Respaldo_Feria_2026_${todayKey()}.json`;
  await saveFile(name, new Blob([JSON.stringify(backupObject())],{type:"application/json"}), "Respaldo descargado.");
}
function validateBackup(o){
  if(!o || typeof o!=="object" || o.app!=="feria-manana-deportiva-2026") return "El archivo no es un respaldo de esta app.";
  if(!o.config || typeof o.config.pinHash!=="string") return "El respaldo no tiene la configuración de la feria.";
  for(const c of COLS){ if(!o[c] || typeof o[c]!=="object" || Array.isArray(o[c])) return `El respaldo está incompleto: falta «${c}».`; }
  for(const p of Object.values(o.productos)) if(!p.id||typeof p.precio!=="number"||typeof p.costo!=="number") return "Hay productos con datos inválidos en el respaldo.";
  for(const s of Object.values(o.ventas)) if(!s.id||!Array.isArray(s.items)||typeof s.total!=="number"||!s.pagos) return "Hay ventas con datos inválidos en el respaldo.";
  return null;
}
async function restoreBackup(file){
  if(!writeGuard()) return;
  let o; try{ o=JSON.parse(await file.text()); }catch(e){ toast("No se pudo leer el archivo: no es un JSON válido.",{type:"err"}); return; }
  const bad=validateBackup(o); if(bad){ toast(bad,{type:"err"}); return; }
  const n=sum(COLS,c=>Object.keys(o[c]).length);
  const ok=await confirmDlg(`Se reemplazarán todos los datos actuales por el respaldo (${Object.keys(o.productos).length} productos, ${Object.keys(o.ventas).length} ventas, ${n} registros en total). El PIN volverá a ser el del respaldo.`,{title:"Restaurar respaldo",ok:"Restaurar",danger:true,input:{label:"Escribe RESTAURAR para confirmar",required:true}});
  if(ok!=="RESTAURAR"){ if(ok) toast("No se restauró: escribe RESTAURAR exactamente.",{type:"err"}); return; }
  await replaceAll(o, "Respaldo restaurado.");
  audit("Respaldo restaurado", file.name, `${n} registros`, n, "registros");
}
async function replaceAll(o, msg){
  const prog=toastProgress("Guardando…");
  try{
    if(MODE==="local"){ for(const c of COLS) S[c]=o[c]||{}; S.config=o.config; saveLocal(); bump(); }
    else {
      const ops=[];
      for(const c of COLS){ const nw=o[c]||{}; for(const id of Object.keys(S[c])) if(!nw[id]) ops.push(()=>DB.collection(c).doc(id).delete()); for(const [id,d] of Object.entries(nw)) ops.push(()=>DB.collection(c).doc(id).set(clean({...d,id}))); }
      ops.push(()=> o.config ? DB.doc("config/app").set(clean(o.config)) : DB.doc("config/app").delete());
      let i=0; const N=ops.length;
      const worker=async()=>{ while(i<N){ const k=i++; try{ await ops[k](); }catch(e){ await sleep(500); await ops[k](); } prog(`Guardando ${Math.min(N,i)} de ${N}…`); } };
      await Promise.all([worker(),worker(),worker(),worker()]);
    }
    prog(null); toast(msg); UI.mounted=null;

async function saveFile(filename, blob, okMsg){
  if(!DOWNLOADS && window.claude && typeof window.claude.use==="function"){ try{ DOWNLOADS = await withTimeout(window.claude.use("downloads"),5000); }catch(e){} }
  if(DOWNLOADS){
    try{ await DOWNLOADS.save({filename, data:blob}); toast(okMsg||"Archivo listo."); return true; }
    catch(e){ if(e && e.code==="declined") { toast("Descarga cancelada."); return false; }
      if(e && e.code==="rate_limited"){ toast("Ya hay una descarga esperando confirmación.",{type:"err"}); return false; }
      if(!(e && ["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code))){ toast("No se pudo descargar el archivo.",{type:"err"}); return false; } }
  }
  try{ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast(okMsg||"Archivo listo."); return true; }
  catch(e){ toast("Las descargas no están disponibles en esta vista.",{type:"err"}); return false; }
}

const XC = {navy:"FF0B1220", blue:"FF2563EB", lime:"FFC8FF5F", grey:"FFF3F5F9", line:"FFDCE2EC", white:"FFFFFFFF", red:"FFC92A2A"};
const FMT = {money:'"$"#,##0.00;[Red]-"$"#,##0.00', date:"dd/mm/yyyy", time:"hh:mm", dt:"dd/mm/yyyy hh:mm", pct:"0.0%", int:"#,##0;[Red]-#,##0"};

/** Hoja con encabezado en la fila 1, filas de datos, fila de totales, filtros y encabezado congelado. */
function dataSheet(wb, name, cols, rows, totals, tabColor){
  const ws=wb.addWorksheet(name,{views:[{state:"frozen",ySplit:1}], properties:{tabColor:{argb:tabColor||XC.blue}}});
  ws.columns=cols.map(c=>({header:c.h, key:c.k, width:c.w||14, style:c.f?{numFmt:FMT[c.f]}:{}}));
  const hr=ws.getRow(1); hr.height=24;
  hr.eachCell(c=>{ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.navy}}; c.font={bold:true,color:{argb:XC.white},name:"Calibri",size:11}; c.alignment={vertical:"middle",horizontal:"center",wrapText:true}; c.border={bottom:{style:"medium",color:{argb:XC.lime}}}; });
  rows.forEach((r,i)=>{ const row=ws.addRow(r); row.eachCell({includeEmpty:true},(c,ci)=>{ const cf=cols[ci-1]; if(cf&&cf.f) c.numFmt=FMT[cf.f]; c.border={bottom:{style:"thin",color:{argb:XC.line}}}; if(i%2===1) c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.grey}}; c.alignment={vertical:"middle"}; }); });
  const first=2, last=Math.max(2, rows.length+1);
  ws.autoFilter={from:{row:1,column:1}, to:{row:Math.max(1,rows.length+1), column:cols.length}};
  if(totals){
    const tr=ws.getRow(last+1);
    for(const [k,v] of Object.entries(totals)){ const ci=cols.findIndex(c=>c.k===k)+1; const cell=tr.getCell(ci); cell.value = typeof v==="function" ? v(colL(ci), first, last) : v; }
    for(let ci=1; ci<=cols.length; ci++){ const cell=tr.getCell(ci); if(cols[ci-1].f) cell.numFmt=FMT[cols[ci-1].f]; cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.lime}}; cell.border={top:{style:"medium",color:{argb:XC.navy}}}; }
    tr.height=22;
  }
  if(!rows.length){ ws.getCell(2,1).value="Sin registros en el período"; ws.getCell(2,1).font={italic:true,color:{argb:"FF7A869E"}}; }
  return {ws, first, last, n:rows.length, tot:last+1};
}

    ["Rentabilidad sobre lo invertido",{formula:"IF((B8+B10)=0,0,B11/(B8+B10))",result:(vCost+gT)?(vNet-vCost-gT)/(vCost+gT):0},"Utilidad neta ÷ (costo vendido + gastos)","pct"],
    ["Transacciones",salesIn.size,"Ventas no anuladas en el período","int"],
    ["Unidades vendidas netas",{formula:`SUMIFS(${dr("E")},${de},"<>Anulada")`,result:vUnits},"Unidades vendidas menos devueltas","int"],
    ["Descuentos otorgados",{formula:`SUMIFS(${dr("G")},${de},"<>Anulada")`,result:usd(vDesc)},"Descuentos repartidos entre los productos de cada venta","money"],
    ["Valor del inventario a costo (actual)",{formula:`Inventario!I${I4.tot}`,result:usd(invVal)},"Stock disponible al momento de exportar × costo unitario","money"]
  ];
  lines.forEach((l,i)=>{ const R=ws.getRow(7+i); R.getCell(1).value=l[0]; R.getCell(2).value=l[1]; R.getCell(2).numFmt=FMT[l[3]]; R.getCell(3).value=l[2]; R.getCell(3).font={color:{argb:"FF7A869E"},size:10}; R.getCell(1).font={bold:[2,4].includes(i)}; R.getCell(2).font={bold:[0,2,4].includes(i)}; [1,2,3].forEach(c=>R.getCell(c).border={bottom:{style:"thin",color:{argb:XC.line}}}); });
  ws.getRow(11).eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.lime}});
  const b0=7+lines.length+1;
  head(b0,"Balance por método de pago","Importe","Desde la hoja «Métodos de pago» (ventas − reembolsos)");
  const mr=`${MS}!C${M6.first}:C${M6.last}`, mi=`${MS}!D${M6.first}:D${M6.last}`;
  METODOS.forEach((m,i)=>{ const R=ws.getRow(b0+1+i); R.getCell(1).value=MLABEL[m]; R.getCell(2).value={formula:`SUMIFS(${mi},${mr},"${MLABEL[m]}")`,result:usd(payT[m])}; R.getCell(2).numFmt=FMT.money; [1,2,3].forEach(c=>R.getCell(c).border={bottom:{style:"thin",color:{argb:XC.line}}}); });
  const tR=ws.getRow(b0+4); tR.getCell(1).value="Total recibido"; tR.getCell(2).value={formula:`SUM(B${b0+1}:B${b0+3})`,result:usd(sum(METODOS,m=>payT[m]))}; tR.getCell(2).numFmt=FMT.money; tR.font={bold:true}; [1,2,3].forEach(c=>tR.getCell(c).fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.lime}});
  const cR=ws.getRow(b0+5); cR.getCell(1).value="Control: total recibido − ventas netas"; cR.getCell(2).value={formula:`ROUND(B${b0+4}-B7,2)`,result:usd(sum(METODOS,m=>payT[m])-vNet)}; cR.getCell(2).numFmt=FMT.money; cR.getCell(3).value="Debe ser $0,00. Si no lo es, revisa pagos y devoluciones."; cR.getCell(3).font={color:{argb:"FF7A869E"},size:10};
  const n0=b0+7;
  ws.getCell(`A${n0}`).value="Notas"; ws.getCell(`A${n0}`).font={bold:true};
  ["Las ventas anuladas aparecen en «Detalle de ventas» con estado «Anulada» y no suman en ningún total.",
   "Las devoluciones aparecen como filas negativas en la fecha en que se registraron.",
   "«Productos» e «Inventario» muestran el estado al momento de exportar, sin filtrar por fecha.",
   "El costo de lo vendido viene de cada venta y los gastos operativos de la hoja «Gastos»: no se cuentan dos veces."].forEach((t,i)=>{ ws.mergeCells(`A${n0+1+i}:C${n0+1+i}`); ws.getCell(`A${n0+1+i}`).value="• "+t; ws.getCell(`A${n0+1+i}`).font={color:{argb:"FF47536D"},size:10}; });
  return wb;
}
function auditRows(inR){
  const a=[];
  for(const s of Object.values(S.ventas)){
    if(inR(s.ts)) a.push({ts:s.ts,tipo:"Venta registrada",ref:s.codigo,usuario:s.vendedor,motivo:`${MLABEL[s.metodo]}${s.descuento?` · descuento ${money(s.descuento)}`:""}${s.obs?` · ${s.obs}`:""}`,valor:usd(s.total),unidad:"USD"});
    for(const d of (s.devoluciones||[])) if(inR(d.ts)) a.push({ts:d.ts,tipo:"Devolución",ref:s.codigo,usuario:d.usuario,motivo:d.motivo,valor:-usd(d.monto),unidad:"USD"});
    if(s.anulacion && inR(s.anulacion.ts)) a.push({ts:s.anulacion.ts,tipo:"Anulación de venta",ref:s.codigo,usuario:s.anulacion.usuario,motivo:s.anulacion.motivo,valor:-usd(saleNet({...s,estado:"x"})),unidad:"USD"});
  }
  for(const m of Object.values(S.movimientos)) if(inR(m.ts)) a.push({ts:m.ts,tipo:m.tipo==="entrada"?"Entrada de inventario":"Ajuste de inventario",ref:`${m.codigo} ${m.nombre}`,usuario:m.usuario,motivo:m.motivo||"",valor:m.cantidad,unidad:"uds"});
  for(const g of Object.values(S.gastos)){
    if(inR(g.registrado||g.ts)) a.push({ts:g.registrado||g.ts,tipo:"Gasto registrado",ref:`${g.categoria} · ${g.descripcion}`,usuario:g.usuario||g.responsable,motivo:g.obs||"",valor:usd(g.monto),unidad:"USD"});
    if(g.anulacion && inR(g.anulacion.ts)) a.push({ts:g.anulacion.ts,tipo:"Gasto anulado",ref:`${g.categoria} · ${g.descripcion}`,usuario:g.anulacion.usuario,motivo:g.anulacion.motivo,valor:-usd(g.monto),unidad:"USD"});
  }
  for(const c of Object.values(S.cajas)){
    if(inR(c.abierta)) a.push({ts:c.abierta,tipo:"Apertura de caja",ref:c.responsable,usuario:c.abiertaPor||c.responsable,motivo:"Fondo inicial",valor:usd(c.fondo),unidad:"USD"});
    for(const m of (c.movimientos||[])) if(inR(m.ts)) a.push({ts:m.ts,tipo:m.tipo==="entrada"?"Entrada de efectivo":"Salida de efectivo",ref:"Caja",usuario:m.usuario,motivo:m.motivo,valor:usd(m.tipo==="entrada"?m.monto:-m.monto),unidad:"USD"});
    if(c.cerrada && c.cierre && inR(c.cerrada)) a.push({ts:c.cerrada,tipo:"Cierre de caja",ref:c.responsable,usuario:c.cierre.cerradoPor,motivo:`Esperado ${money(c.cierre.esperado)}, contado ${money(c.cierre.contado)}${c.cierre.obs?` · ${c.cierre.obs}`:""}`,valor:usd(c.cierre.diferencia),unidad:"USD dif."});
  }
  for(const x of Object.values(S.auditoria)) if(inR(x.ts)) a.push({ts:x.ts,tipo:x.tipo,ref:x.ref,usuario:x.usuario,motivo:x.motivo,valor:x.valor===""?null:x.valor,unidad:x.valor===""?"":x.unidad});
  return a.sort((x,y)=>x.ts-y.ts);
}

    ws.mergeCells("A1:B1"); ws.getCell("A1").value="FERIA MAÑANA DEPORTIVA 2026 · Cierre de caja"; ws.getCell("A1").font={bold:true,size:14,color:{argb:XC.lime}}; ws.getCell("A1").fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.navy}}; ws.getRow(1).height=28;
    const rows=[["Apertura",xd(c.abierta),"dt"],["Cierre",xd(c.cerrada),"dt"],["Responsable",c.responsable],["Cerrado por",k.cerradoPor],["Fondo inicial",usd(c.fondo),"money"],["Ventas en efectivo",usd(k.efectivoVentas),"money"],["Entradas de efectivo",usd(k.entradas),"money"],["Salidas de efectivo",usd(k.salidas),"money"],
      ["Efectivo esperado",{formula:"B7+B8+B9-B10",result:usd(k.esperado)},"money"],["Efectivo contado",usd(k.contado),"money"],["Diferencia (+ sobrante / − faltante)",{formula:"B12-B11",result:usd(k.diferencia)},"money"],["Transferencias",usd(k.transferencias),"money"],["Tarjetas",usd(k.tarjetas),"money"],["Total por métodos de pago",{formula:"B8+B14+B15",result:usd(k.total)},"money"],["Ventas en el turno",k.ventas||0],["Observaciones",k.obs||""]];
    rows.forEach((r2,i)=>{ const R=ws.getRow(3+i); R.getCell(1).value=r2[0]; R.getCell(2).value=r2[1]; if(r2[2]) R.getCell(2).numFmt=FMT[r2[2]]; R.getCell(1).font={bold:true}; [1,2].forEach(cc=>R.getCell(cc).border={bottom:{style:"thin",color:{argb:XC.line}}}); if([8,10].includes(i)) [1,2].forEach(cc=>R.getCell(cc).fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.lime}}); });
    const mv=(c.movimientos||[]).map(m=>[xd(m.ts),m.tipo==="entrada"?"Entrada":"Salida",m.motivo,usd(m.tipo==="entrada"?m.monto:-m.monto),m.usuario]);
    dataSheet(wb,"Movimientos de efectivo",[{h:"Fecha y hora",k:"f",w:17,f:"dt"},{h:"Tipo",k:"t",w:10},{h:"Motivo",k:"m",w:34},{h:"Monto",k:"v",w:13,f:"money"},{h:"Usuario",k:"u",w:18}], mv, {f:"TOTAL", v:(L,f,l)=>({formula:`SUM(${L}${f}:${L}${l})`,result:usd(k.entradas-k.salidas)})});
    const vs=Object.values(S.ventas).filter(s=>s.ts>=c.abierta && s.ts<=c.cerrada).sort((a,b)=>a.ts-b.ts).map(s=>[s.codigo,xd(s.ts),s.items.map(i=>`${i.cantidad}× ${i.nombre}`).join(", "),usd(s.total),MLABEL[s.metodo],s.vendedor,estadoVenta(s)]);
    dataSheet(wb,"Ventas del turno",[{h:"ID de venta",k:"id",w:13},{h:"Fecha y hora",k:"f",w:17,f:"dt"},{h:"Productos",k:"p",w:40},{h:"Total",k:"t",w:12,f:"money"},{h:"Forma de pago",k:"m",w:15},{h:"Vendedor",k:"v",w:18},{h:"Estado",k:"e",w:16}], vs, null);
    const buf=await wb.xlsx.writeBuffer();
    await saveFile(`Cierre_Caja_${dayKey(c.cerrada)}_${fT(c.cerrada).replace(":","h")}.xlsx`, new Blob([buf]), "Cierre exportado.");
